<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ng HelloWorld</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Reference to external CSS file -->
    <style>
      /* 1. Reset margins and paddings, enforce border-box */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* 2. Ensure base layers allow full height inheritance */
      html,
      body {
        width: 100%;
        height: 100%;
      }

      /* 3. The full-width, full-height container layout */
      .full-page-container {
        width: 100%;
        /* min-height ensures it's at least full screen but grows if content overflows */
        min-height: 100vh;

        /* Flexbox makes centering text/content effortless */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        /* Example background and typography styling */
        /* background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); */
        /* color: #ffffff; */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 10px;
      }

      p {
        font-size: 1.2rem;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <app-root class="full-page-container"></app-root>
  </body>
</html>
